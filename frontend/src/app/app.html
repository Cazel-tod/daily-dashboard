<header class="app-header">
  <button
    type="button"
    class="theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-pressed]="themeService.theme() === 'dark'"
    aria-label="Basculer le thème clair/sombre"
  >
    {{ themeService.theme() === 'dark' ? '☀️' : '🌙' }}
  </button>
</header>

<router-outlet />
